name: Capture complete TrialMap interaction
on:
  push:
    branches: [review/trialmap-full-film-20261101]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: |
          node server.mjs &
          sleep 1
          node media-capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trialmap-full-interaction
          retention-days: 5
          path: media-capture/
