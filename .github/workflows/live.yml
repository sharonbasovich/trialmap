name: Verify live TrialMap Pages
on:
  workflow_dispatch:
  push:
    paths:
      - 'live.config.ts'
      - 'tests/live.spec.ts'
      - '.github/workflows/live.yml'
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=live.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trialmap-live-review
          path: |
            live-evidence/
            live-test-results/
